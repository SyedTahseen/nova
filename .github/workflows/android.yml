name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo has no Gradle wrapper, so install the version the project needs (AGP 8.7 -> Gradle 8.9+).
      # If you commit gradlew later, replace `gradle` below with `./gradlew` and drop gradle-version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Xray core, pulled in during the build. Skipped when you commit app/libs/libv2ray.aar yourself.
      - name: Fetch libv2ray.aar (Xray core)
        if: hashFiles('app/libs/libv2ray.aar') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir app/libs
          ls -l app/libs

      # Country borders for the map (Natural Earth). Skipped when app/src/main/assets/world.bin is committed.
      - name: Generate world map
        if: hashFiles('app/src/main/assets/world.bin') == ''
        run: python3 tools/generate_world_map.py

      # Round country flags (circle-flags, MIT). Skipped when you commit app/src/main/assets/flags/gb.png.
      # Missing flags fall back to emoji in the app, so a partial download never breaks the build.
      - name: Fetch country flags
        if: hashFiles('app/src/main/assets/flags/gb.png') == ''
        run: |
          sudo apt-get install -y --no-install-recommends libcairo2
          pip install cairosvg
          python3 tools/fetch_flags.py

      # Optional: sign with your own key. Add these repository secrets to enable it
      # (KEYSTORE_BASE64 = `base64 -w0 your.jks`). Without them the release APK is signed
      # with the debug key, which still installs fine for testing.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      # Release build = R8 shrinking + one APK per CPU architecture + a Play Store bundle.
      - name: Build release APKs and bundle
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Show APK sizes
        run: ls -lh app/build/outputs/apk/release/*.apk

      # Pushes / manual runs: publish a pre-release with the APKs attached as plain files
      # (Releases page -> click the .apk to download it directly, no zip).
      - name: Publish release with APKs
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # Pull requests can't create releases, so fall back to a (zipped) workflow artifact there.
      - name: Upload APKs (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nova-vpn-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
