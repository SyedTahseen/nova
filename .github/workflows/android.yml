name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo has no Gradle wrapper, so install the version the project needs (AGP 8.7 -> Gradle 8.9+).
      # If you commit gradlew later, replace `gradle` below with `./gradlew` and drop gradle-version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Xray core. Skipped when you commit app/libs/libv2ray.aar yourself.
      - name: Fetch libv2ray.aar
        if: hashFiles('app/libs/libv2ray.aar') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download --repo 2dust/AndroidLibXrayLite --pattern 'libv2ray.aar' --dir app/libs
          ls -l app/libs

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
